{% extends "base.html" %}
{% load socialaccount %}

{% block title %}Prihlaseni | Skolni knihovna{% endblock %}

{% block content %}
<h2>Prihlaseni</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Prihlasit</button>
</form>
<p><a href="{% url 'accounts:password_reset' %}">Zapomenute heslo?</a></p>
<p>
    Nemate ucet?
    <a href="{% url 'accounts:signup' %}">Registrujte se</a>
</p>

<h3>OAuth prihlaseni</h3>
<ul>
    <li><a href="{% provider_login_url 'google' process='login' %}">Google</a></li>
    <li><a href="{% provider_login_url 'microsoft' process='login' %}">Microsoft</a></li>
    <li><a href="{% provider_login_url 'github' process='login' %}">GitHub</a></li>
</ul>
{% endblock %}
