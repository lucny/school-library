{% extends "base.html" %}

{% block title %}Registrace | Skolni knihovna{% endblock %}

{% block content %}
<h2>Registrace</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

</form>
<p>
    Uz mate ucet?
    <a href="{% url 'accounts:login' %}">Prihlaste se</a>
</p>
{% endblock %}
